version: v0.13.0

dsn: memory # overridden at runtime via DSN env var

# Connection pool — gobuffalo/pop settings (DSN query params are no-ops in pgx).
# These are the correct knobs for Kratos v1.x.
database:
  max_open_connections: 50
  max_idle_connections: 10
  max_connection_lifetime: 1h

serve:
  public:
    base_url: http://kratos:4433/
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/

  allowed_return_urls:
    - http://localhost:3000
    - http://localhost:8081

  methods:
    password:
      enabled: true
      config:
        min_password_length: 8
        identifier_similarity_check_enabled: true

    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            # client_id and client_secret are injected via env vars at runtime:
            # SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID
            # SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET
            client_id: changeme
            client_secret: changeme
            mapper_url: file:///etc/config/kratos/google.mapper.jsonnet
            scope:
              - email
              - profile

    profile:
      enabled: true

    link:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:3000/error

    settings:
      ui_url: http://localhost:3000/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://localhost:3000/recovery

    verification:
      enabled: true
      ui_url: http://localhost:3000/verification
      after:
        default_browser_return_url: http://localhost:3000/

    logout:
      after:
        default_browser_return_url: http://localhost:3000/login

    login:
      ui_url: http://localhost:3000/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: http://localhost:3000/registration
      after:
        oidc:
          hooks:
            - hook: session

session:
  lifespan: 24h
  cookie:
    persistent: false

log:
  level: info
  format: json
  leak_sensitive_values: false

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET} # overridden via SECRETS_COOKIE env var
  cipher:
    - ${KRATOS_CIPHER_SECRET} # overridden via SECRETS_CIPHER env var

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: person
  schemas:
    - id: person
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
