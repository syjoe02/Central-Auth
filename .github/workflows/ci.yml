name: CI — Central-Auth (Go)

on:
  push:
    branches: [dev]

# ─────────────────────────────────────────────────────────────────────────────
# Three-stage test pipeline
#
# ① unit-test       — pure business-logic verification using in-memory mocks
#                     (miniredis, httptest servers). No external services.
#
# ② integration-test — verifies real I/O boundaries:
#                     • Redis: real redis:7-alpine service container
#                     • Kratos HTTP client: mock HTTP server started in-process
#                     Runs after unit-test passes.
#
# ③ contract-test   — pins the observable API surface for downstream consumers
#                     (Kotlin Spring Security, FastAPI python-jose):
#                     JWT claims structure, JWKS RFC 7517 format.
#                     Runs after unit-test passes (parallel with ②).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ① Unit Tests
  # External deps: none — all Redis/Kratos/Hydra calls use in-memory mocks.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: "1. Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module graph
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -coverprofile=unit.out ./...

      - name: Coverage report
        run: |
          total=$(go tool cover -func=unit.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Unit test coverage: ${total}%"
          awk "BEGIN { if (${total} < 50) { print \"WARNING: coverage ${total}% is below the 50% threshold\" } }"

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: unit.out
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ② Integration Tests
  # Verifies that the real Redis repository and Kratos HTTP client work
  # correctly against live service containers.
  #
  # Redis:  GHA service container (redis:7-alpine), accessible at localhost:6379
  # Kratos: mock httptest.Server started inside the test process itself —
  #         no extra container needed.
  # ──────────────────────────────────────────────────────────────────────────
  integration-test:
    name: "2. Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for Redis
        run: |
          for i in $(seq 1 10); do
            redis-cli -h localhost -p 6379 ping && break
            echo "Waiting for Redis… ($i/10)"
            sleep 2
          done

      - name: Run integration tests
        run: >
          go test -race -tags integration
          -coverprofile=integration.out
          -v
          ./internal/repository/...

      - name: Coverage report
        run: |
          total=$(go tool cover -func=integration.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Integration test coverage (repository): ${total}%"

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: integration.out
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ③ Contract Tests
  # Pins the JWT claims shape and JWKS format that downstream services
  # (Kotlin backendKotlin, FastAPI backendFastapi) depend on.
  #
  # No external services — uses an in-process httptest.Server as Hydra mock.
  # Runs in parallel with integration-test (both need only unit-test to pass).
  # ──────────────────────────────────────────────────────────────────────────
  contract-test:
    name: "3. Contract Tests"
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run contract tests
        run: >
          go test -race -tags contract
          -v
          ./internal/contract/...
