name: CI/CD — Central-Auth (Go)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/syjoe02/central-auth
  INFRA_REPO: syjoe02/Hackonomics-Infra
  INFRA_VALUES: helm/hackonomics-infra/values.yaml

jobs:
  # ──────────────────────────────────────────────
  # 1. Test
  # ──────────────────────────────────────────────
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          awk "BEGIN{if(${coverage}<50){print \"WARNING: coverage ${coverage}% is below 50%\"}}"

  # ──────────────────────────────────────────────
  # 2. Build & Push Docker image to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    # Only build on push (not PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-$(git rev-parse --short=8 HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Update Infra repo → triggers ArgoCD sync
  # ──────────────────────────────────────────────
  update-infra:
    name: Update Infra values.yaml
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only run on push to main or semver tags
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update central-auth image tag in values.yaml
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          yq e '.central-auth.app.image.repository = "${{ env.IMAGE_NAME }}"' -i infra/${{ env.INFRA_VALUES }}
          yq e ".central-auth.app.image.tag = \"${IMAGE_TAG}\"" -i infra/${{ env.INFRA_VALUES }}

      - name: Update Chart appVersion on semver tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          yq e ".appVersion = \"${IMAGE_TAG}\"" -i infra/helm/hackonomics-infra/Chart.yaml

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.INFRA_VALUES }} helm/hackonomics-infra/Chart.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(central-auth): update image tag to ${IMAGE_TAG} [skip ci]"
          git push
