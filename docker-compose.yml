services:
  redis:
    image: redis:7-alpine
    container_name: central-auth-redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: central-auth-postgres
    command: postgres -c max_connections=300
    env_file:
      - ./env/.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    networks:
      default: {}
      shared-monitor-net:
        aliases:
          - postgres
  # Kafka is provided by the shared Hackonomics-Infra stack on shared-monitor-net.
  # auth-server connects to kafka:9092 via that network — no local broker needed.

  # ─── Ory Kratos: Identity Management ───────────────────────────────────────

  kratos-migrate:
    image: oryd/kratos:v1.3.0
    container_name: central-auth-kratos-migrate
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  kratos:
    image: oryd/kratos:v1.3.0
    container_name: central-auth-kratos
    env_file:
      - ../.env.shared
      - ./env/.env.prod
    ports:
      - "4433:4433" # public
    expose:
      - "4434" # admin — internal only, never routed to host
    environment:
      # Pool limits are set in kratos/kratos.yml (database.max_open_connections etc.)
      # DSN query params are no-ops in gobuffalo/pop — do not add them here.
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
      - ./kratos/google.mapper.jsonnet:/etc/config/kratos/google.mapper.jsonnet:ro
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    depends_on:
      - kratos-migrate
    restart: always

  # ─── Ory Hydra: OAuth2 / OIDC ──────────────────────────────────────────────

  hydra-migrate:
    image: oryd/hydra:v2.3.0
    container_name: central-auth-hydra-migrate
    env_file:
      - ./env/.env.prod
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: central-auth-hydra
    env_file:
      - ../.env.shared
      - ./env/.env.prod
    ports:
      - "4444:4444" # public (OAuth2 endpoints)
    expose:
      - "4445" # admin — internal only, never routed to host
    command: serve all --dev
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      # Hydra connection pool — set via env vars (DSN query params are no-ops).
      DB_MAX_OPEN_CONNS: 20
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 3600
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
      # ADR-001: canonical issuer sourced from .env.shared (URLS_SELF_ISSUER=http://hydra:4444/)
      # Invariant: URLS_SELF_ISSUER == Go BFF expected issuer == Django EXPECTED_JWT_ISSUER
      URLS_SELF_ISSUER: ${URLS_SELF_ISSUER}
      URLS_LOGIN: http://auth-server:8081/hydra/login
      URLS_CONSENT: http://auth-server:8081/hydra/consent
      URLS_LOGOUT: http://auth-server:8081/hydra/logout
      # Issue access tokens as JWTs so the Go service can validate locally without
      # a Hydra round-trip on every /auth/verify call.
      STRATEGIES_ACCESS_TOKEN: jwt
      TTL_ACCESS_TOKEN: 15m
      TTL_REFRESH_TOKEN: 720h # 30 days; short sessions enforced via Redis device TTL
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      - hydra-migrate
    restart: always

  # Registers the central-auth OAuth2 client in Hydra on first start.
  hydra-client-init:
    image: oryd/hydra:v2.3.0
    container_name: central-auth-hydra-client-init
    env_file:
      - ./env/.env.prod
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
    command: >
      create oauth2-client
      --endpoint http://hydra:4445
      --id ${HYDRA_CLIENT_ID}
      --secret ${HYDRA_CLIENT_SECRET}
      --grant-type authorization_code,refresh_token,client_credentials
      --response-type code,id_token
      --scope openid,offline_access,email,profile
      --redirect-uri http://auth-server:8081/internal/oauth/callback
      --token-endpoint-auth-method client_secret_post
    depends_on:
      hydra:
        condition: service_healthy
    restart: "no"

  # ─── Go Auth Server ─────────────────────────────────────────────────────────

  auth-server:
    build: .
    container_name: central-auth-server
    ports:
      - "8081:8081"
    expose:
      - "9091"
      - "50051"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started
      hydra:
        condition: service_healthy
    env_file:
      - ../.env.shared
      - ./env/.env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_ADDR: redis:6379
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      METRICS_ALLOWED_CIDR: "${METRICS_ALLOWED_CIDR:-172.20.0.0/16}"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "access-logs"
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      default: {}
      shared-monitor-net:
        aliases:
          - auth-server
    restart: always

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: central-auth-postgres-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-backups:

networks:
  shared-monitor-net:
    external: true
