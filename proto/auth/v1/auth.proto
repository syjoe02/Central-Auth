syntax = "proto3";

package auth.v1;

option go_package = "central-auth/gen/go/auth/v1;authv1";

// ─── Enums ────────────────────────────────────────────────────────────────────

enum AuthErrorCode {
  AUTH_ERROR_CODE_UNSPECIFIED        = 0;
  AUTH_ERROR_CODE_INVALID_CREDENTIALS = 1;
  AUTH_ERROR_CODE_INVALID_TOKEN      = 2;
  AUTH_ERROR_CODE_EMAIL_CONFLICT     = 3;
  AUTH_ERROR_CODE_RATE_LIMITED       = 4;
  AUTH_ERROR_CODE_INTERNAL           = 5;
}

enum LoginMethod {
  LOGIN_METHOD_UNSPECIFIED     = 0;
  LOGIN_METHOD_PASSWORD        = 1;
  LOGIN_METHOD_KRATOS_ID       = 2;
  LOGIN_METHOD_GOOGLE          = 3;
}

// ─── Shared ───────────────────────────────────────────────────────────────────

// ErrorInfo is embedded in google.rpc.Status details for structured errors.
// reason = AuthErrorCode name string (e.g., "INVALID_CREDENTIALS")
// domain = "auth.v1"
message ErrorInfo {
  string reason = 1;
  string domain = 2;
}

// ─── Signup ───────────────────────────────────────────────────────────────────

message SignupRequest {
  string email    = 1;
  string password = 2;
  // x-idempotency-key in metadata is required; interceptor enforces it.
}

message SignupResponse {
  string ory_id = 1;
  string email  = 2;
  // NOTE: Signup does NOT return tokens. Caller must call Login afterward.
}

// ─── Login ────────────────────────────────────────────────────────────────────

message LoginRequest {
  // Exactly one of (email+password) or kratos_id must be set.
  // method indicates which path to take; interceptor validates consistency.
  LoginMethod method    = 1;
  string email          = 2; // used with METHOD_PASSWORD or METHOD_GOOGLE
  string password       = 3; // used with METHOD_PASSWORD only
  string kratos_id      = 4; // used with METHOD_KRATOS_ID only
  string device_id      = 5;
  bool   remember_me    = 6;
  string user_agent     = 7; // optional, for audit
  string ip             = 8; // optional, for audit
  // x-idempotency-key in metadata deduplicates concurrent login attempts.
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

// ─── Refresh ─────────────────────────────────────────────────────────────────

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

// ─── Logout ───────────────────────────────────────────────────────────────────

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

// ─── LogoutAll ────────────────────────────────────────────────────────────────

message LogoutAllRequest {
  string refresh_token = 1;
}

message LogoutAllResponse {}

// ─── Verify ───────────────────────────────────────────────────────────────────

message VerifyRequest {
  string access_token = 1;
}

message VerifyResponse {
  string kratos_id  = 1;
  string device_id  = 2;
  int64  expires_at = 3; // Unix timestamp
}

// ─── GoogleLogin ──────────────────────────────────────────────────────────────

message GoogleLoginRequest {
  string email     = 1; // verified email from Google OIDC token
  string device_id = 2;
  bool   remember_me = 3;
  string user_agent  = 4;
  string ip          = 5;
}

message GoogleLoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service AuthService {
  // Signup creates a new identity in Kratos. Does NOT issue tokens.
  // Requires x-idempotency-key metadata.
  rpc Signup(SignupRequest) returns (SignupResponse);

  // Login issues access + refresh tokens.
  // Supports password, pre-authenticated KratosID, and Google paths.
  // Requires x-idempotency-key metadata.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh rotates refresh token and issues new access token.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout invalidates a single session identified by refresh token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // LogoutAll invalidates all sessions for the identity owning the token.
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);

  // Verify validates an access token and returns identity claims.
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  // GoogleLogin looks up the identity by email and issues tokens.
  // Called by Django after successful Google OIDC exchange via Kratos.
  rpc GoogleLogin(GoogleLoginRequest) returns (GoogleLoginResponse);
}
